[project]
name = "novae-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi>=0.146.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "pydantic>=2",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "httpx2>=2.14.0",
    "mutmut>=3.8.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.mutmut]
debug = true
source_paths = ["app/"]
pytest_add_cli_args_test_selection = ["tests/test_ai_mediator.py"]
also_copy = [
    "main.py",
    ".env",
]

[tool.pytest.ini_options]
pythonpath = ["."]